server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name manageipod.laposabulb.com;
    ssl_certificate /etc/letsencrypt/live/manageipod.laposabulb.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/manageipod.laposabulb.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    auth_basic "Gestione iPod";
    auth_basic_user_file /etc/nginx/ipod-manager.htpasswd;
    client_max_body_size 128m;
    add_header X-Robots-Tag "noindex" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    location / {
        proxy_pass http://unix:/run/ipod-manager/http.sock;
        proxy_set_header Authorization "";
        proxy_read_timeout 180s;
    }
}
