<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#242626">
  <meta name="description" content="I link di LA POSA BULB, in un iPod interattivo.">
  <title>LA POSA BULB · Link e store</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="band.js"></script>
</head>
<body>
  <main class="ipod" aria-label="LA POSA BULB · iPod interattivo">
    <section class="screen" aria-label="Display dell’iPod">
      <header class="screen-bar">
        <span aria-hidden="true">▸</span>
        <h1 id="screen-title"><span>LA POSA BULB</span></h1>
      </header>
      <div class="product-detail" hidden>
        <img class="product-image" alt="" width="72" height="72" hidden>
        <div class="product-info">
          <h2 class="product-name"></h2>
          <p class="product-price" hidden></p>
        </div>
      </div>
      <ul class="entries" id="entries" aria-label="Voci del menu"></ul>
      <div class="music-player" hidden>
        <p class="now-playing">
          <span id="playback-state" class="playback-state" role="img"></span>
          <span id="now-playing"></span>
        </p>
        <progress id="track-position" max="1" value="0" aria-label="Avanzamento del brano"></progress>
        <p id="track-time">0:00 / 0:00</p>
      </div>
      <audio id="music" preload="none"></audio>
      <p class="status" id="status" role="status"></p>
    </section>

    <div class="controls" aria-describedby="instructions">
      <button type="button" class="menu" aria-label="MENU, torna indietro">
        <span class="menu-legend" aria-hidden="true">menu</span>
      </button>
      <button type="button" class="previous" aria-label="Voce precedente">
        <span class="control-icon" aria-hidden="true"><i class="icon-triangle"></i><i class="icon-triangle"></i><i class="icon-bar"></i></span>
      </button>
      <button type="button" class="next" aria-label="Voce successiva">
        <span class="control-icon" aria-hidden="true"><i class="icon-triangle"></i><i class="icon-triangle"></i><i class="icon-bar"></i></span>
      </button>
      <button type="button" class="play" aria-label="Apri la voce selezionata">
        <span class="control-icon" aria-hidden="true"><i class="icon-triangle"></i><i class="icon-bar"></i><i class="icon-bar"></i></span>
      </button>
      <div class="wheel" aria-hidden="true"></div>
      <button type="button" class="select" aria-label="Seleziona la voce evidenziata"></button>
    </div>
  </main>
  <p class="instructions" id="instructions">Ruota la ghiera o usa ◀▶ per scorrere. Premi al centro per aprire.</p>
</body>
</html>
